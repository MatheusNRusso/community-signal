spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
            redirect-uri: "${BASE_URL}/login/oauth2/code/github"
  application:
    name: review-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

server:
  port: ${PORT:8080}
  shutdown: graceful

api:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

app:
  frontend-url: ${FRONTEND_URL}
  topics:
    approved-drafts: approved-drafts
  oauth:
    allowed-github-users: ${ALLOWED_GITHUB_USERS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Community Signal
    version: 1.0.0
    description: AI-assisted content curation with human-in-the-loop review

logging:
  level:
    com.community.signal: INFO
    org.springframework.kafka: WARN
    org.springframework.security.oauth2: DEBUG
